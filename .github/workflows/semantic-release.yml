name: Semantic Release

on:
  workflow_call:
    secrets:
      REPOSILITE_USER:
        required: true
      REPOSILITE_TOKEN:
        required: true

concurrency:
  group: semantic-release-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Create semantic release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Checkout workflow templates
        uses: actions/checkout@v4
        with:
          repository: RandyMCNetwork/pipeline-templates
          ref: main
          path: .template-source
          token: ${{ github.token }}
          persist-credentials: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run checks and tests
        run: ./gradlew check --no-daemon

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          node .template-source/.github/scripts/resolve-publish-version.mjs next | tee /tmp/version.out >> "$GITHUB_OUTPUT"
          echo "Resolved release metadata:"
          cat /tmp/version.out

      - name: Tag released version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists"
            exit 0
          fi

          git tag "$TAG"
          git push origin "$TAG"

      - name: Upload release to Reposilite
        env:
          REPOSILITE_USER: ${{ secrets.REPOSILITE_USER }}
          REPOSILITE_TOKEN: ${{ secrets.REPOSILITE_TOKEN }}
        run: ./gradlew publish -Pversion=${{ steps.version.outputs.version }} --no-daemon
