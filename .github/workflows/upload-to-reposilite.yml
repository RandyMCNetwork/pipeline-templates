name: Upload to Reposilite

on:
  workflow_call:
    secrets:
      REPOSILITE_USER:
        required: true
      REPOSILITE_TOKEN:
        required: true
  push:
    branches:
      - dev
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: upload-reposilite-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish:
    name: Upload artifacts to Reposilite
    if: >
      github.event_name == 'push' ||
      startsWith(github.head_ref, 'feature/') ||
      startsWith(github.head_ref, 'codex/') ||
      startsWith(github.head_ref, 'fix/') ||
      startsWith(github.head_ref, 'hotfix/')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Checkout workflow templates
        uses: actions/checkout@v4
        with:
          repository: RandyMCNetwork/pipeline-templates
          ref: main
          path: .template-source
          token: ${{ github.token }}
          persist-credentials: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run checks and tests
        run: ./gradlew check --no-daemon

      - name: Resolve publish version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            node .template-source/.github/scripts/resolve-publish-version.mjs pr "${{ github.event.number }}" | tee /tmp/version.out >> "$GITHUB_OUTPUT"
          else
            node .template-source/.github/scripts/resolve-publish-version.mjs dev | tee /tmp/version.out >> "$GITHUB_OUTPUT"
          fi
          echo "Resolved publish metadata:"
          cat /tmp/version.out

      - name: Upload to Reposilite
        env:
          REPOSILITE_USER: ${{ secrets.REPOSILITE_USER }}
          REPOSILITE_TOKEN: ${{ secrets.REPOSILITE_TOKEN }}
        run: ./gradlew publish -Pversion=${{ steps.version.outputs.version }} --no-daemon
