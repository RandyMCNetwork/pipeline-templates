name: Gradle

on:
  workflow_call:
    inputs:
      runs-on:
        description: Runner image or labels used for the Gradle build.
        required: false
        type: string
        default: self-hosted
      timeout-minutes:
        description: Maximum job execution time in minutes.
        required: false
        type: number
        default: 45
      cache:
        description: Cache configuration passed to setup-java. Defaults to auto (disabled on self-hosted, gradle on hosted).
        required: false
        type: string
        default: auto
      java-version:
        description: Java version used for the Gradle build.
        required: false
        type: string
        default: '25'
      lifecycle:
        description: Gradle lifecycle tasks run together, for example 'check publish'.
        required: false
        type: string
        default: check
      app-version:
        description: Optional application version passed to Gradle as -Pversion.
        required: false
        type: string
        default: ''
      gradle-arguments:
        description: Optional additional Gradle arguments and project properties.
        required: false
        type: string
        default: ''
    secrets:
      REPOSILITE_USER:
        required: false
      REPOSILITE_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  gradle:
    name: Run Gradle lifecycle
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          java-version: ${{ inputs.java-version }}
          distribution: temurin
          cache: ${{ inputs.cache != 'auto' && inputs.cache || (!contains(inputs.runs-on, 'self-hosted') && 'gradle' || '') }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Gradle lifecycle
        env:
          REPOSILITE_USER: ${{ secrets.REPOSILITE_USER }}
          REPOSILITE_TOKEN: ${{ secrets.REPOSILITE_TOKEN }}
          TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE: ${{ contains(inputs.runs-on, 'self-hosted') && '/var/run/docker.sock' || '' }}
        run: ./gradlew ${{ inputs.lifecycle }} --daemon --parallel --build-cache ${{ inputs.app-version != '' && format('-Pversion={0}', inputs.app-version) || '' }} ${{ inputs.gradle-arguments }}
