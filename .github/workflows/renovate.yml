name: Renovate

on:
  workflow_call:
    inputs:
      runs-on:
        description: Runner label for the Renovate job.
        required: false
        type: string
        default: self-hosted
      disabled-packages:
        description: Newline-separated Renovate package names or patterns to disable for this repository.
        required: false
        type: string
        default: ''
      timeout-minutes:
        description: Maximum Renovate job duration.
        required: false
        type: number
        default: 45
    secrets:
      RENOVATE_APP_ID:
        required: true
      RENOVATE_APP_PRIVATE_KEY:
        required: true

permissions:
  contents: read

jobs:
  renovate:
    name: Update dependencies
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}

    steps:
      - name: Checkout consuming repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Checkout workflow templates
        uses: actions/checkout@v7
        with:
          repository: RandyMCNetwork/pipeline-templates
          ref: main
          path: .template-source
          persist-credentials: false

      - name: Create repository-scoped Renovate token
        id: renovate-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Run Renovate
        uses: renovatebot/github-action@v46
        with:
          configurationFile: .template-source/.github/renovate/config.js
          token: ${{ steps.renovate-token.outputs.token }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_DISABLED_PACKAGES: ${{ inputs.disabled-packages }}
