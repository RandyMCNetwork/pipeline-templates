name: Build and Push GHCR Image

on:
  workflow_call:
    inputs:
      image:
        description: Optional full lowercase GHCR image name, without a tag. Defaults to the calling repository.
        required: false
        type: string
        default: ''
      context:
        description: Docker build context.
        required: false
        type: string
        default: .
      file:
        description: Optional Dockerfile path.
        required: false
        type: string
        default: ''
      tags:
        description: docker/metadata-action tag definitions.
        required: false
        type: string
        default: |-
          type=sha,prefix=sha-,format=short
          type=ref,event=branch
          type=raw,value=latest,enable={{is_default_branch}}
      build-args:
        description: Newline-separated Docker build arguments.
        required: false
        type: string
        default: ''
    outputs:
      image-ref:
        description: Immutable pushed image reference, including digest.
        value: ${{ jobs.build.outputs.image-ref }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    outputs:
      image-ref: ${{ steps.image.outputs.ref }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Resolve image name
        id: image-name
        env:
          IMAGE: ${{ inputs.image }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$IMAGE" ]; then
            IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          fi
          echo "value=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Add immutable channel tag
        id: channel-tag
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_REF_NAME" in
            main|dev|test)
              printf 'definition=type=raw,value=%s-sha-%s\n' "$GITHUB_REF_NAME" "${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image-name.outputs.value }}
          tags: |
            ${{ inputs.tags }}
            ${{ steps.channel-tag.outputs.definition }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ inputs.build-args }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export immutable image reference
        id: image
        env:
          IMAGE: ${{ steps.image-name.outputs.value }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: echo "ref=${IMAGE}@${DIGEST}" >> "$GITHUB_OUTPUT"
