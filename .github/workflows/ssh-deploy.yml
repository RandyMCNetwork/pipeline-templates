name: SSH Deploy

on:
  workflow_call:
    inputs:
      image-ref:
        description: Immutable image reference passed to the remote deployment script.
        required: true
        type: string
      script-path:
        description: Deployment script in the calling repository, executed on the remote host.
        required: false
        type: string
        default: .github/scripts/deploy.sh
      environment:
        description: Calling repository environment containing the VPS secrets and deployment rules.
        required: false
        type: string
        default: production
    secrets:
      VPS_HOST:
        description: SSH host; may also be supplied by the selected environment.
        required: false
      VPS_USER:
        description: SSH user; may also be supplied by the selected environment.
        required: false
      VPS_SSH_KEY:
        description: SSH private key; may also be supplied by the selected environment.
        required: false
      VPS_PORT:
        description: Optional SSH port, defaults to 22.
        required: false
      VPS_DEPLOY_PATH:
        description: Remote deployment directory; may also be supplied by the selected environment.
        required: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy via SSH
    runs-on: light
    environment: ${{ inputs.environment }}
    timeout-minutes: 15
    env:
      DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
      IMAGE_REF: ${{ inputs.image-ref }}
    steps:
      - name: Checkout deployment script
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Deploy via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: DEPLOY_PATH,IMAGE_REF
          script_path: ${{ inputs.script-path }}
