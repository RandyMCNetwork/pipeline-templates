name: Node Check

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version used for the project.
        required: false
        type: string
        default: '22'
      cache:
        description: Package cache mode passed to setup-node. Auto disables GitHub cache on self-hosted runners.
        required: false
        type: string
        default: auto
      install-command:
        description: Dependency installation command.
        required: false
        type: string
        default: npm ci
      lint-command:
        description: Optional lint command. Leave empty to skip it.
        required: false
        type: string
        default: ''
      test-command:
        description: Optional test command. Leave empty to skip it.
        required: false
        type: string
        default: npm test
      build-command:
        description: Optional build command. Leave empty to skip it.
        required: false
        type: string
        default: npm run build
      build-environment:
        description: Newline-separated KEY=VALUE variables for the build command.
        required: false
        type: string
        default: ''
      docker-build:
        description: Build the Docker image after Node checks on this same runner.
        required: false
        type: boolean
        default: false
      docker-context:
        description: Docker build context when docker-build is true.
        required: false
        type: string
        default: .
      dockerfile:
        description: Optional Dockerfile path when docker-build is true.
        required: false
        type: string
        default: ''
      docker-tags:
        description: Optional local Docker image tag when docker-build is true.
        required: false
        type: string
        default: ''
      docker-build-args:
        description: Newline-separated Docker build arguments when docker-build is true.
        required: false
        type: string
        default: ''
      docker-platforms:
        description: Target platform(s) for the Docker build when docker-build is true.
        required: false
        type: string
        default: linux/amd64
      runs-on:
        description: Runner image or labels used for the Node check job.
        required: false
        type: string
        default: self-hosted

permissions:
  contents: read

jobs:
  check:
    name: Run Node checks
    runs-on: ${{ inputs.runs-on }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.cache != 'auto' && inputs.cache || (!contains(inputs.runs-on, 'self-hosted') && 'npm' || '') }}
          package-manager-cache: ${{ inputs.cache != 'auto' || !contains(inputs.runs-on, 'self-hosted') }}

      - name: Install dependencies
        run: ${{ inputs.install-command }}

      - name: Run linter
        if: inputs.lint-command != ''
        run: ${{ inputs.lint-command }}

      - name: Run tests
        if: inputs.test-command != ''
        run: ${{ inputs.test-command }}

      - name: Build project
        if: inputs.build-command != ''
        env:
          BUILD_ENVIRONMENT: ${{ inputs.build-environment }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$BUILD_ENVIRONMENT" ]; then
            while IFS= read -r entry; do
              if [ -n "$entry" ]; then
                export "$entry"
              fi
            done <<< "$BUILD_ENVIRONMENT"
          fi
          ${{ inputs.build-command }}

      - name: Set up Docker Buildx
        if: inputs.docker-build
        uses: docker/setup-buildx-action@v4
        with:
          name: ${{ contains(inputs.runs-on, 'self-hosted') && 'randy-buildkit' || '' }}
          keep-state: ${{ contains(inputs.runs-on, 'self-hosted') }}
          cache-binary: ${{ !contains(inputs.runs-on, 'self-hosted') }}

      - name: Build Docker image
        if: inputs.docker-build
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.docker-context }}
          file: ${{ inputs.dockerfile }}
          push: false
          platforms: ${{ inputs.docker-platforms }}
          tags: ${{ inputs.docker-tags }}
          build-args: ${{ inputs.docker-build-args }}
          cache-from: ${{ !contains(inputs.runs-on, 'self-hosted') && 'type=gha' || '' }}
          cache-to: ${{ !contains(inputs.runs-on, 'self-hosted') && 'type=gha,mode=max' || '' }}
