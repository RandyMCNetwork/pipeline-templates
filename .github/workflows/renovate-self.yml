name: Renovate (self)

on:
  schedule:
    - cron: '5 1 * * *'
      timezone: Europe/Berlin
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renovate:
    uses: ./.github/workflows/renovate.yml
    with:
      # Self-hosted runners do not serve public repositories; GitHub-hosted runners are free here.
      runs-on: ubuntu-latest
    secrets: inherit
